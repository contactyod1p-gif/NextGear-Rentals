openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NextGear Rentals API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Vehicle booking operations
  - name: rentals
    description: Public rental booking submission (rate-limited)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      description: Returns all vehicle bookings
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      description: Submit a new vehicle rental booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Booking deleted
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rentals/book:
    post:
      operationId: createRentalBook
      tags: [rentals]
      summary: Submit a rental booking (rate-limited)
      description: >
        Public-facing booking endpoint. Rate-limited to 5 requests per IP per
        15 minutes. Validates all fields strictly and persists to the bookings table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalBookInput"
      responses:
        "201":
          description: Booking successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalBookResponse"
        "400":
          description: Validation error — missing or malformed fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalBookError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/stats/summary:
    get:
      operationId: getBookingStats
      tags: [bookings]
      summary: Booking statistics summary
      description: Returns aggregated booking stats (total, by vehicle, etc.)
      responses:
        "200":
          description: Booking statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Booking:
      type: object
      required:
        - id
        - fullName
        - phoneNumber
        - selectedVehicle
        - rentalDays
        - bookingDate
      properties:
        id:
          type: integer
        fullName:
          type: string
        phoneNumber:
          type: string
        selectedVehicle:
          type: string
        rentalDays:
          type: integer
        bookingDate:
          type: string
          format: date-time

    BookingInput:
      type: object
      required:
        - fullName
        - phoneNumber
        - selectedVehicle
        - rentalDays
        - bookingDate
      properties:
        fullName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        selectedVehicle:
          type: string
          minLength: 1
        rentalDays:
          type: integer
          minimum: 1
        bookingDate:
          type: string
          format: date-time

    BookingStats:
      type: object
      required:
        - totalBookings
        - vehicleBreakdown
        - averageRentalDays
      properties:
        totalBookings:
          type: integer
        vehicleBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/VehicleCount"
        averageRentalDays:
          type: number

    VehicleCount:
      type: object
      required:
        - vehicle
        - count
      properties:
        vehicle:
          type: string
        count:
          type: integer

    RentalBookInput:
      type: object
      required:
        - fullName
        - phoneNumber
        - selectedVehicle
        - rentalDays
        - bookingDate
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 80
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 20
          description: "E.g. +91 98765 43210 — must be a valid phone number format"
        selectedVehicle:
          type: string
          minLength: 1
        rentalDays:
          type: integer
          minimum: 1
          maximum: 90
        bookingDate:
          type: string
          format: date-time

    RentalBookResponse:
      type: object
      required:
        - success
        - bookingId
        - reference
        - message
        - booking
      properties:
        success:
          type: boolean
        bookingId:
          type: integer
        reference:
          type: string
        message:
          type: string
        booking:
          $ref: "#/components/schemas/Booking"

    RentalBookError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        field:
          type: string
          nullable: true
        details:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                nullable: true
              message:
                type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
